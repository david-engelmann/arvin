[workspace]
members = [".", "bindings"]
default-members = [".", "bindings"]
resolver = "2"

[package]
name = "arvin"
version = "0.1.0"
edition = "2021"
description = "Arvin, a staged cutoff for agent runs that moves in stages on an operator pull, a budget ceiling, or missed proofs"
license = "MIT"

[lib]
name = "arvin"
path = "src/lib.rs"

[[bin]]
name = "arvin"
path = "src/bin/arvin.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
fs2 = "0.4"
getrandom = "0.3"

[dev-dependencies]
sha2 = "0.10"
