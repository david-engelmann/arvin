[workspace]
members = [".", "bindings"]
default-members = [".", "bindings"]
resolver = "2"

[package]
name = "arvin"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
default-run = "arvin"
description = "A staged cutoff for agent runs, where a run keeps its tools, budget, and sandbox only while it keeps proving progress. Three triggers move the stage, an operator pull, a budget ceiling, and missed proofs."
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/arvin"
homepage = "https://github.com/david-engelmann/arvin"
documentation = "https://docs.rs/arvin"
keywords = ["agent", "safety", "kill-switch", "budget", "escalation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/**", "bindings/**", "python/**", "pyproject.toml", "tests/fixtures/**"]

[lib]
name = "arvin"
path = "src/lib.rs"

[[bin]]
name = "arvin"
path = "src/bin/arvin.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
fs2 = "0.4"
getrandom = "0.3"

[dev-dependencies]
sha2 = "0.10"
