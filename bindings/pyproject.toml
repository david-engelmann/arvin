[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "arvin"
version = "0.1.0"
description = "Arvin, a staged kill switch for agent runs that escalates in stages when proofs stop"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "arvin._arvin"
python-source = "../python"
