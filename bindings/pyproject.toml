[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "arvin"
version = "0.1.0"
description = "Arvin, a staged cutoff for agent runs that moves in stages on an operator pull, a budget ceiling, or missed proofs"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "arvin._arvin"
python-source = "../python"
