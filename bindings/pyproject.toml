[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "arvin"
version = "0.1.0"
description = "A staged cutoff for agent runs, where a run keeps its tools, budget, and sandbox only while it keeps proving progress. Three triggers move the stage, an operator pull, a budget ceiling, and missed proofs."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "arvin._arvin"
python-source = "../python"
