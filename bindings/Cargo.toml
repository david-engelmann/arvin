[package]
name = "deadman-bindings"
version = "0.1.0"
edition = "2021"
description = "The thin Python binding over the deadman crate, carrying no logic of its own"
license = "MIT"

[lib]
name = "deadman"
crate-type = ["cdylib", "rlib"]

[dependencies]
deadman-core = { package = "deadman", path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
