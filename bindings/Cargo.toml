[package]
name = "arvin-bindings"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "The thin Python binding over the arvin crate, carrying no logic of its own"
license = "MIT"
repository = "https://github.com/david-engelmann/arvin"

[lib]
name = "arvin"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
arvin-core = { package = "arvin", path = ".." }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
